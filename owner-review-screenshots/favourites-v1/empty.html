<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favourites — Empty State</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e8e8e8; }
    .phone { width: 390px; min-height: 844px; margin: 24px auto; background: #fff; }
    .header { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 56px; padding: 0 8px; }
    .back { width: 44px; height: 44px; border: 0; background: transparent; font-size: 22px; }
    .title { margin: 0; text-align: center; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
    .fav-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; padding: 32px 24px; text-align: center; }
    .icon { font-size: 40px; color: #ec4899; margin-bottom: 16px; }
    .t { margin: 0; font-size: 18px; font-weight: 600; color: #1a1a1a; }
    .c { margin: 8px 0 0; font-size: 14px; color: #64748b; line-height: 1.45; }
    .browse {
      margin-top: 24px; min-width: 160px; min-height: 44px; padding: 0 24px;
      border: 0; border-radius: 16px; background: #9333ea; color: #fff;
      font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .note { text-align: center; color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="header">
      <button class="back" type="button" aria-label="Back">‹</button>
      <h1 class="title">FAVOURITES</h1>
      <span></span>
    </header>
    <div class="fav-empty">
      <span class="icon">♡</span>
      <p class="t">Save your favourites</p>
      <p class="c">Favourite some items and<br />find them here</p>
      <a class="browse" href="/">BROWSE</a>
    </div>
  </div>
  <p class="note">Empty state · Browse → / (marketplace) · live: http://localhost:3010/saved</p>
</body>
</html>
