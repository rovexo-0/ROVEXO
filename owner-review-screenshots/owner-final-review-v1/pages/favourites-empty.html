<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Owner Review — Favourites Empty</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e8e8e8}
    .phone{width:390px;min-height:844px;margin:24px auto;background:#fff}
    .header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;padding:0 8px}
    .back{border:0;background:transparent;font-size:22px;width:44px;height:44px}
    .title{margin:0;text-align:center;font-size:14px;font-weight:600;letter-spacing:.04em}
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:32px;text-align:center}
    .heart{font-size:56px;color:#ec4899;margin-bottom:16px}
    .t{margin:0;font-size:18px;font-weight:600}
    .c{margin:8px 0 0;font-size:14px;color:#64748b}
    .browse{margin-top:24px;min-width:160px;min-height:44px;border:0;border-radius:16px;background:#9333ea;color:#fff;font-weight:600;letter-spacing:.04em;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:0 24px}
    .note{text-align:center;color:#64748b;font-size:13px}
  </style>
</head>
<body>
  <div class="phone">
    <header class="header"><button class="back" type="button">‹</button><h1 class="title">FAVOURITES</h1><span></span></header>
    <div class="empty">
      <span class="heart">♡</span>
      <p class="t">Save your favourites</p>
      <p class="c">Favourite some items and find them here.</p>
      <a class="browse" href="/">BROWSE</a>
    </div>
  </div>
  <p class="note">Live: http://localhost:3010/saved</p>
</body>
</html>
