<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Owner Review — Followers</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e8e8e8}
    .phone{width:390px;min-height:844px;margin:24px auto;background:#fff}
    .header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;padding:0 8px}
    .back{border:0;background:transparent;font-size:22px;width:44px;height:44px}
    .title{margin:0;text-align:center;font-size:14px;font-weight:600}
    .page{padding:16px}
    .tabs{display:flex;gap:8px}
    .tab{border:0;border-radius:999px;padding:8px 12px;background:#f8fafc;font-size:13px}
    .tab.on{background:rgb(147 51 234 / .12);color:#9333ea}
    .empty{margin-top:40px;text-align:center;color:#94a3b8;font-size:14px}
    .note{text-align:center;color:#64748b;font-size:13px}
  </style>
</head>
<body>
  <div class="phone">
    <header class="header"><button class="back" type="button">‹</button><h1 class="title">Followers</h1><span></span></header>
    <main class="page">
      <div class="tabs"><button class="tab on" type="button">Followers 0</button><button class="tab" type="button">Following 0</button></div>
      <p class="empty">No followers yet.</p>
    </main>
  </div>
  <p class="note">Live: http://localhost:3010/account/followers</p>
</body>
</html>
