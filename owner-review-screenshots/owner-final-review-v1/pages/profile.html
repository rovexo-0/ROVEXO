<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Owner Review — Profile</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e8e8e8;color:#1a1a1a}
    .phone{width:390px;min-height:844px;margin:24px auto;background:#fff;padding-bottom:24px}
    .header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;padding:0 8px}
    .back{border:0;background:transparent;font-size:22px;width:44px;height:44px}
    .title{margin:0;text-align:center;font-size:14px;font-weight:600;letter-spacing:.04em}
    .page{padding:8px 16px}
    .identity{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;text-decoration:none;color:inherit}
    .avatar{width:64px;height:64px;border-radius:999px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;color:#94a3b8}
    .name{margin:0;font-size:16px;font-weight:400}
    .view{margin:2px 0 0;font-size:16px;color:#9333ea}
    .rating{margin:2px 0 0;font-size:16px}
    .r{color:#9333ea}.s{color:#f5b301}
    .followers{display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:inherit}
    .f-icon{color:#9333ea;font-size:18px}
    .f-val{color:#9333ea}
    .chev{margin-left:auto;color:#1a1a1a;font-size:16px}
    .row{display:flex;align-items:center;gap:12px;min-height:56px;text-decoration:none;color:inherit;font-size:16px;font-weight:400;border:0;background:transparent;width:100%;padding:0}
    .icon{width:24px;text-align:center;font-size:18px}
    .label{flex:1}.danger{color:#dc2626}
    .note{text-align:center;color:#64748b;font-size:13px}
  </style>
</head>
<body>
  <div class="phone">
    <header class="header"><button class="back" type="button">‹</button><h1 class="title">PROFILE</h1><span></span></header>
    <main class="page">
      <a class="identity" href="#"><span class="avatar">U</span><span><p class="name">Username</p><p class="view">View Profile</p><p class="rating"><span class="r">0.0</span><span class="s"> ★ </span><span class="r">(0)</span></p></span><span class="chev">›</span></a>
      <a class="followers" href="#"><span class="f-icon">👥</span><span class="f-val">0</span><span>Followers</span><span class="chev">›</span></a>
      <nav>
        <a class="row" href="#"><span class="icon" style="color:#ec4899">♡</span><span class="label">Favourites</span><span class="chev">›</span></a>
        <a class="row" href="#"><span class="icon" style="color:#2563eb">💳</span><span class="label">Balance</span><span class="chev">›</span></a>
        <a class="row" href="#"><span class="icon" style="color:#f97316">📦</span><span class="label">My Orders</span><span class="chev">›</span></a>
        <a class="row" href="#"><span class="icon" style="color:#16a34a">🌴</span><span class="label">Holiday Mode</span><span class="chev">›</span></a>
        <a class="row" href="#"><span class="icon" style="color:#9333ea">⚙</span><span class="label">Settings</span><span class="chev">›</span></a>
        <a class="row" href="#"><span class="icon" style="color:#ec4899">❓</span><span class="label">Help Centre</span><span class="chev">›</span></a>
        <a class="row" href="#"><span class="icon" style="color:#6b7280">🛡</span><span class="label">Legal Information</span><span class="chev">›</span></a>
        <button class="row" type="button"><span class="icon" style="color:#dc2626">↩</span><span class="label danger">Sign Out</span></button>
      </nav>
    </main>
  </div>
  <p class="note">Live: http://localhost:3010/account</p>
</body>
</html>
