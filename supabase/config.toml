# Supabase local development configuration
# Docs: https://supabase.com/docs/guides/cli

project_id = "rovexo"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Owner Auth Master Freeze v1.0 — local origin SSOT: http://localhost:3000
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/callback?next=%2Faccount",
  "http://localhost:3000/auth/callback?next=%2Freset-password",
  "http://localhost:3000/verify-email",
  "https://www.rovexo.co.uk/auth/callback",
  "https://www.rovexo.co.uk/verify-email",
  "https://rovexo.co.uk/auth/callback",
  "https://rovexo.co.uk/verify-email",
]

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[storage]
enabled = true
file_size_limit = "10MiB"
