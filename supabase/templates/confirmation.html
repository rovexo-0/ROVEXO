<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your email address</title>
  </head>
  <body style="margin:0;padding:0;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#ffffff;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:16px;">
            <tr>
              <td align="center" style="padding:24px 24px 8px;">
                <img
                  src="{{ .SiteURL }}/brand/canonical-rx/primary-emblem-auth-v4.png"
                  alt="ROVEXO"
                  width="180"
                  style="display:block;width:180px;max-width:70%;height:auto;border:0;"
                />
              </td>
            </tr>
            <tr>
              <td style="padding:16px 24px 8px;text-align:left;">
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:700;color:#111827;">
                  Welcome to ROVEXO
                </h1>
                <p style="margin:0;font-size:16px;line-height:1.55;color:#4b5563;">
                  Please confirm your email address to activate your account.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 24px;">
                <!-- Direct ROVEXO route — never supabase.co hosted verify UI -->
                <a
                  href="{{ .SiteURL }}/verify-email?token_hash={{ .TokenHash }}&amp;type=signup"
                  style="display:inline-block;width:100%;max-width:432px;box-sizing:border-box;padding:16px 24px;background:linear-gradient(135deg,#a855f7,#9333ea,#7c3aed);color:#ffffff;text-decoration:none;font-size:17px;font-weight:600;border-radius:16px;text-align:center;"
                >
                  Confirm Email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 24px 32px;text-align:center;">
                <p style="margin:0;font-size:13px;line-height:1.5;color:#9ca3af;">
                  © ROVEXO Marketplace
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
